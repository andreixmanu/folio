# Local development only for now: `npm run dev` (wrangler dev). No deploy, no account needed.
name = "folio-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false
send_metrics = false

[dev]
port = 8787
ip = "0.0.0.0"

# Placeholder id is enough for `wrangler dev` and local KV (`--local`).
# A real namespace id is needed only for a future deploy.
[[kv_namespaces]]
binding = "XAI_AUTH"
id = "folio-xai-auth-local"

[vars]
XAI_MODEL = "grok-4.7"
