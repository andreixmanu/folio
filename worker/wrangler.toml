# Local dev: `npm run dev` (wrangler dev). Deploy to workers.dev with `npx wrangler deploy`.
name = "folio-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true
send_metrics = false

[dev]
port = 8787
ip = "0.0.0.0"

# Remote namespace. Local `wrangler dev` and `wrangler kv --local` persist under this id.
# Previous local data is under `folio-xai-auth-local`; run `npm run login:xai` again.
[[kv_namespaces]]
binding = "XAI_AUTH"
id = "671d4e3224e742d3a0d812e76976a6b9"

[vars]
XAI_MODEL = "grok-4.7"

# Open banking (Enable Banking, AIS read-only). Not active yet: until the
# binding and the secrets below exist, every /bank/* route answers 503.
# 1. npx wrangler d1 create folio-bank   (then paste the id below and uncomment)
# 2. npx wrangler d1 migrations apply folio-bank --remote
# 3. npx wrangler secret put ENABLE_BANKING_APP_ID
#    npx wrangler secret put ENABLE_BANKING_PRIVATE_KEY   (PKCS#8 PEM)
#    npx wrangler secret put BANK_REDIRECT_URL            (https://folio-api.manu-andrei.workers.dev/bank/callback)
# [[d1_databases]]
# binding = "BANK_DB"
# database_name = "folio-bank"
# database_id = "<id from wrangler d1 create>"
# migrations_dir = "migrations"
